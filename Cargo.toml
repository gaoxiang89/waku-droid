[package]
name = "waku"
default-run = "narel"
version.workspace = true
edition = "2024"
description = "A fast, native control plane for local coding agents"
license = "GPL-3.0-only"

[[bin]]
name = "narel"
path = "src/main.rs"

[[bin]]
name = "narel_cli"
path = "src/bin/narel_cli.rs"

[[bin]]
name = "narel_js_repl"
path = "src/bin/narel_js_repl.rs"

[[bin]]
name = "narel-updater"
path = "src/bin/narel-updater.rs"

[workspace]
members = ["crates/waku-client", "crates/waku-core", "crates/waku-daemon", "crates/waku-protocol", "crates/waku-computer-use"]
default-members = [
  ".",
  "crates/waku-client",
  "crates/waku-core",
  "crates/waku-daemon",
  "crates/waku-protocol",
  "crates/waku-computer-use",
]
resolver = "2"

[workspace.package]
# The one release version. Every crate inherits it, so the daemon reports the
# same version as the app it ships with.
version = "0.1.64"

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
anyhow = "1.0"
base64 = "0.22"
chrono = "0.4"
crossbeam-channel = "0.5"
dirs = "6.0"
# The egoist/zed fork is upstream main plus PR #61945 (layered scene
# rendering), which lets GPUI composite menus and tooltips above native child
# views — the browser surface's WKWebView. Drop back to upstream once the PR
# merges.
gpui = { git = "https://github.com/egoist/zed", branch = "waku-webview" }
gpui_platform = { git = "https://github.com/egoist/zed", branch = "waku-webview", features = [
  "font-kit",
  "wayland",
  "x11",
] }
parking_lot = "0.12"
# Alacritty's PTY registration trait names polling types; the terminal wraps
# its PTY to scan output for desktop notifications.
polling = "3"
rquickjs = "0.12.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-segmentation = "1.12"
unicode-linebreak = "0.1.5"
url = "2"
uuid = { version = "1.18", features = ["v4", "serde"] }
waku-client = { path = "crates/waku-client" }
waku-protocol = { path = "crates/waku-protocol" }
pulldown-cmark = "0.13"
# Mermaid fences: ondine's pure-Rust Mermaid-to-SVG compiler (not on crates.io).
ondine = { package = "compiler", git = "https://github.com/wevm/ondine", rev = "6a1586e5af980e67c104239593ae931837157b8b" }
# Native, offline math typesetting; all layout and raster work runs on workers.
ratex-parser = "=0.1.14"
ratex-layout = "=0.1.14"
ratex-types = "=0.1.14"
ratex-svg = { version = "=0.1.14", features = ["embed-fonts"] }
regex = "1"
rust-i18n = "4"
smol = "2"
ropey = "=2.0.0-beta.1"
futures-lite = "2"
futures = "0.3"
nucleo-matcher = "0.3.1"

# `test-support` has to stay test-only. It compiles a loop into gpui's
# `flush_effects` that draws every dirty window right there, so with the
# feature on a shipping build every notify pays a full frame the moment it
# happens instead of coalescing into the display link's next one — a panel
# resize drew once per mouse-move event rather than once per displayed frame.
[dev-dependencies]
gpui = { git = "https://github.com/egoist/zed", branch = "waku-webview", features = [
  "test-support",
] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
wry = { version = "0.56", features = ["devtools"] }
block2 = "0.6"
# Matches the version GPUI itself renders with, so RenderImage frames are the
# same `image` types.
image = "0.25"
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "objc2-app-kit",
  "WKWebView",
  "WKSnapshotConfiguration",
] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSAccessibility",
  "NSAppearance",
  "NSApplication",
  "NSBitmapImageRep",
  "NSCell",
  "NSColor",
  "NSEvent",
  "NSGraphics",
  "NSGraphicsContext",
  "NSImage",
  "NSImageRep",
  "NSMenu",
  "NSMenuItem",
  "NSResponder",
  "NSRunningApplication",
  "NSView",
  "NSVisualEffectView",
  "NSWindow",
  "NSWorkspace",
  "block2",
  "objc2-core-graphics",
  "objc2-quartz-core",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSBundle",
  "NSData",
  "NSDictionary",
  "NSError",
  "NSFileManager",
  "NSGeometry",
  "NSKeyValueObserving",
  "NSLocale",
  "NSProcessInfo",
  "NSString",
  "NSURL",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationSound",
  "UNNotificationTrigger",
  "UNUserNotificationCenter",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
  "std",
  "CALayer",
  "objc2-core-graphics",
] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# Linux verifies the release archive with the same key as Sparkle and unpacks
# it into a sibling staging prefix before the handoff helper swaps it in.
ed25519-dalek = "2"
flate2 = "1"
# Matches the version GPUI exposes through `WindowOptions::icon`.
image = { version = "0.25", default-features = false, features = ["png", "bmp", "tiff"] }
tar = "0.4"

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3.0"

[target.'cfg(target_os = "windows")'.dependencies]
# The Windows clipboard hands images over as a DIB, which GPUI reports as BMP.
# A terminal paste re-encodes it to PNG, since agent CLIs read only PNG/JPEG.
image = { version = "0.25", default-features = false, features = ["png", "bmp", "tiff"] }
raw-window-handle = "0.6"
# The browser surface. WebView2 is evergreen on Windows 10 and in-box on 11.
# Waku drives it through `webview2-com` rather than wry because it needs the
# *composition* controller, which renders into a DirectComposition visual
# instead of a child HWND — see `browser::host` for why, and note that only
# the environment can create one, so it cannot be reached from wry's
# `WebViewExtWindows` after the fact.
webview2-com = "0.38"
# Same version GPUI is built against, so the portal's `IDCompositionVisual`
# hands straight to `SetRootVisualTarget` with no ABI bridging. `windows-sys`
# stays for the plain Win32 calls that do not need COM.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61"
# GPUI does not read the Windows animation preference, so Waku asks
# `SystemParametersInfoW` itself. Same major version as the one already in the
# graph through GPUI.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
# Verifies the EdDSA signatures `generate_appcast` writes, so the Windows
# updater trusts the same key Sparkle does on macOS.
ed25519-dalek = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep debug assertions for app code, but do not run GPUI's text shaping and
# Taffy layout hot paths completely unoptimized.
[profile.dev]
opt-level = 1
# Only the hand-edited workspace crates get an incremental cache (the
# per-package overrides below). The ~950 dependency crates never change during
# a session, so caching them would only add gigabytes of object copies under
# target/debug/incremental while saving nothing.
incremental = false
# Line tables for workspace code: this is what makes a dev-build backtrace and
# `sample`/perf profile point at a line in src/.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
# Dependencies keep their symbol names but no PDB or line tables. Keeping line
# tables for the whole graph wrote gigabytes of dependency PDBs into
# target/debug and made every final link merge them; profilers still resolve
# dependency frames by symbol, and the app's own frames stay debuggable.
debug = 0

# The app crate is a 120k-line monolith, so a non-incremental rebuild of one
# edited module recompiled the whole crate (about 3 minutes on the 16-core dev
# machine, measured). These six crates are the ones edited by hand; dev.ts
# prunes each cache to its two newest sessions after every build, which keeps
# the directory from growing without bound the way it once did.
[profile.dev.package.waku]
incremental = true
debug = "line-tables-only"

[profile.dev.package.waku-core]
incremental = true
debug = "line-tables-only"

[profile.dev.package.waku-client]
incremental = true
debug = "line-tables-only"

[profile.dev.package.waku-protocol]
incremental = true
debug = "line-tables-only"

[profile.dev.package.waku-daemon]
incremental = true
debug = "line-tables-only"

[profile.dev.package.waku-computer-use]
incremental = true
debug = "line-tables-only"

# With debug assertions GPUI creates its D3D11 device with the debug layer,
# which fails on every adapter on some Windows machines (0x887A0002) even with
# the SDK layers installed, so the debug app could not start.
[profile.dev.package.gpui_windows]
debug-assertions = false

# `block` 0.1.6 declares an extern static with an uninhabited type. This fork
# is the crates.io release plus the future-incompatibility fix only.
[patch.crates-io]
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }
