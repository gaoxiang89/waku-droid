name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Enclosure links point at this fork's GitHub Release assets; the tag rides
  # in the path, so the appcast scripts resolve the {version} placeholder per
  # item. The feeds themselves are fetched via releases/latest/download.
  WAKU_DOWNLOAD_URL_PREFIX: https://github.com/gaoxiang89/waku-droid/releases/download/v{version}/

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      published: ${{ steps.published.outputs.published }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version from Cargo.toml
        id: resolve
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "::error::No version found in Cargo.toml"
            exit 1
          fi
          # Cargo.toml is the source of truth. A tag push must agree with it;
          # a manual run has no tag and simply releases what Cargo.toml says.
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version as v$version"

      # A published release for this version is already the finished product,
      # so rebuilding it would burn 90 minutes and could replace artifacts
      # people have downloaded. A leftover draft is this workflow's own
      # output, so it does not count and gets overwritten as before.
      - name: Look for an existing published release
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq .isDraft 2>/dev/null) || draft=missing
          if [ "$draft" = false ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is already published; skipping this run"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  # WSL and SSH hosts run this daemon, so every desktop package carries both
  # architectures. musl links it statically: a host's glibc can be older than
  # the runner's.
  remote-daemon:
    name: Remote daemon (Linux ${{ matrix.arch }})
    needs: version
    if: needs.version.outputs.published != 'true'
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0
          rustup target add "$TARGET"

      - name: Install musl
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.runner }}-rust-1.97.0-musl-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.runner }}-rust-1.97.0-musl-

      - name: Build
        run: |
          cargo build --locked --release --target "$TARGET" \
            --package waku-daemon --bin waku-daemon
          mkdir -p remote-daemon
          cp "target/$TARGET/release/waku-daemon" \
            "remote-daemon/waku-daemon-linux-${{ matrix.arch }}"
          # A dynamically linked result would install fine and then fail to
          # start on hosts with a different libc.
          info=$(file -b "remote-daemon/waku-daemon-linux-${{ matrix.arch }}")
          echo "$info"
          case "$info" in
            *"statically linked"* | *"static-pie linked"*) ;;
            *) echo "::error::waku-daemon is not statically linked"; exit 1 ;;
          esac
          "remote-daemon/waku-daemon-linux-${{ matrix.arch }}" --fingerprint

      - uses: actions/upload-artifact@v7
        with:
          name: remote-daemon-linux-${{ matrix.arch }}
          path: remote-daemon/waku-daemon-linux-${{ matrix.arch }}
          if-no-files-found: error

  windows-x86_64:
    name: Windows x86_64
    needs: [version, remote-daemon]
    if: needs.version.outputs.published != 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0
          rustup target add x86_64-pc-windows-msvc

      - uses: oven-sh/setup-bun@v2

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-latest-rust-1.97.0-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            windows-latest-rust-1.97.0-release-

      # `target/` is restored from the release cache, so the previous
      # release's bundles are still sitting in `target/release` when this one
      # starts. Cargo does not own them, so nothing else clears them.
      - name: Clear stale bundles
        run: Remove-Item -Force -ErrorAction SilentlyContinue target/release/waku-*.zip, target/release/Waku-*-Setup.exe

      - uses: actions/download-artifact@v8
        with:
          pattern: remote-daemon-linux-*
          path: target/remote-daemons
          merge-multiple: true
          # Both legs must land: the packaging scripts warn (rather than fail)
          # on an architecture they cannot find, for local builds' sake.
          if-no-files-found: error

      - name: Bundle
        env:
          WAKU_REMOTE_DAEMONS_DIR: ${{ github.workspace }}/target/remote-daemons
          WAKU_ANALYTICS_ENDPOINT: ${{ secrets.WAKU_ANALYTICS_ENDPOINT }}
          WAKU_ANALYTICS_WEBSITE_ID: ${{ secrets.WAKU_ANALYTICS_WEBSITE_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: bun scripts/bundle-windows.ts

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: |
            target/release/waku-${{ needs.version.outputs.version }}-x86_64-pc-windows-msvc.zip
            target/release/Waku-${{ needs.version.outputs.version }}-x86_64-Setup.exe
          if-no-files-found: error

  draft-release:
    name: Draft GitHub release
    needs: [version, windows-x86_64]
    if: needs.version.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Write the version pointers
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # What the website's Windows download resolves "latest" to. In-app
          # updates read the appcasts instead. Linux desktop builds were
          # dropped, so there is no latest-linux.txt anymore.
          echo "$VERSION" > artifacts/latest-windows.txt

      # Signed here rather than on platform runners: this is the only job that
      # holds every native artifact, and the signing key stays in one place.
      - name: Sign the Windows update feed
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # Merge into the live feed so previously published releases keep
          # their entries; a first run simply starts from nothing. The fork's
          # live feed is the latest published release's own asset. Only
          # windows x86_64 is fetched: the Linux and arm64 desktop builds were
          # dropped, and their feeds are no longer regenerated.
          curl -fsSL --max-time 30 \
            "https://github.com/gaoxiang89/waku-droid/releases/latest/download/appcast-windows-x86_64.xml" \
            -o "artifacts/appcast-windows-x86_64.xml" || true
          bun scripts/appcast-windows.ts artifacts "$VERSION"

      - name: Write release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          bun -e '
            import { extractReleaseNotes } from "./scripts/changelog.ts";
            const version = process.env.VERSION;
            const file = Bun.file("CHANGELOG.md");
            const notes = (await file.exists())
              ? extractReleaseNotes(await file.text(), version)
              : null;
            await Bun.write(
              "release-notes.md",
              `${notes ?? "See CHANGELOG.md for details."}\n`,
            );
          '

      # GITHUB_TOKEN can never hold the `workflows` permission, so GitHub
      # answers 403 "Resource not accessible by integration" whenever the
      # release's target commit carries workflow files that differ from the
      # default branch, even if the tag already exists. A tag push already
      # pins the commit, so the target is only sent for a manual run that has
      # no tag yet. Workflow edits pushed to main mid-run still break that
      # manual case; land them before dispatching.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          target=()
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            target=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            "${target[@]}" \
            --title "$TAG" \
            --notes-file release-notes.md \
            artifacts/*.zip \
            artifacts/*.exe \
            artifacts/appcast-windows-*.xml \
            artifacts/latest-windows.txt
