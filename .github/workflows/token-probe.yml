name: Token probe

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Try creating and deleting a draft release with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(gh api -X POST repos/gaoxiang89/waku-droid/releases \
            -F tag_name=v0.0.0-gh-token-probe -F draft=true -F name="gh token probe" \
            2>&1 -w "\n%{http_code}" | tail -1) || true
          echo "create status: $code"
          if [ "$code" = "201" ]; then
            id=$(gh api repos/gaoxiang89/waku-droid/releases --jq '.[] | select(.tag_name=="v0.0.0-gh-token-probe") | .id')
            gh api -X DELETE "repos/gaoxiang89/waku-droid/releases/$id"
            echo "cleaned up"
          fi
