name: Token probe 2

on:
  workflow_dispatch:

# Deliberately mirrors release.yml: top-level read, job-level write.
permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Try creating and deleting a draft release with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api -X POST repos/gaoxiang89/waku-droid/releases \
            -F tag_name=v0.0.0-gh-token-probe2 -F draft=true -F name="gh token probe 2" \
            > /tmp/resp.json 2>/tmp/err.txt; then
            echo "create: OK"
            id=$(gh api repos/gaoxiang89/waku-droid/releases --jq '.[] | select(.tag_name=="v0.0.0-gh-token-probe2") | .id')
            gh api -X DELETE "repos/gaoxiang89/waku-droid/releases/$id"
            echo "cleaned up"
          else
            echo "create: FAILED"
            cat /tmp/err.txt
          fi
