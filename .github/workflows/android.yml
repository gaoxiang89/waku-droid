name: Android

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - "packages/waku-client/**"
      - "patches/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/waku-client/**"
      - "patches/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install JavaScript dependencies
        run: |
          bun install --frozen-lockfile
          if [ ! -f node_modules/expo-libghostty/android/vendor/arm64-v8a/libghostty-vt.a ]; then
            node node_modules/expo-libghostty/scripts/download-android-libs.mjs
          fi
          test -f node_modules/expo-libghostty/android/vendor/arm64-v8a/libghostty-vt.a

      - name: Typecheck and test mobile client
        run: |
          bun run --filter @waku/client check
          bun run --filter @waku/client test
          bun run --filter @waku/mobile typecheck
          bun run --filter @waku/mobile test

      - name: Configure Android SDK & NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Could not locate Android sdkmanager under $SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Generate Android project (Expo Prebuild)
        run: |
          cd apps/mobile
          bunx expo prebuild --platform android --no-install
          bun -e '
            const fs = require("node:fs");
            const file = "android/gradle.properties";
            let content = fs.readFileSync(file, "utf8");
            const next = "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8";
            if (/^org\.gradle\.jvmargs=.*$/m.test(content)) {
              content = content.replace(/^org\.gradle\.jvmargs=.*$/m, next);
            } else {
              content += `\n${next}\n`;
            }
            fs.writeFileSync(file, content);
          '
          grep -n "reactNativeArchitectures\|newArchEnabled\|org.gradle.jvmargs" android/gradle.properties

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ubuntu-24.04-android-gradle-${{ hashFiles('apps/mobile/package.json', 'apps/mobile/app.json', 'bun.lock', '.github/workflows/android.yml') }}
          restore-keys: |
            ubuntu-24.04-android-gradle-

      - name: Build Release APK
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign and verify APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          RELEASE_DIR="apps/mobile/android/app/build/outputs/apk/release"
          INPUT_APK="$RELEASE_DIR/app-release.apk"
          OUTPUT_APK="$RELEASE_DIR/waku-android.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -f "$INPUT_APK"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            KEYSTORE_FILE="/tmp/waku-release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            "$APKSIGNER" sign \
              --ks "$KEYSTORE_FILE" \
              --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --key-pass "env:ANDROID_KEY_PASSWORD" \
              --out "$OUTPUT_APK" \
              "$INPUT_APK"
            rm -f "$KEYSTORE_FILE"
          else
            cp "$INPUT_APK" "$OUTPUT_APK"
          fi
          "$APKSIGNER" verify --verbose "$OUTPUT_APK"
          ls -lh "$OUTPUT_APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: waku-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/waku-android.apk
          if-no-files-found: error
