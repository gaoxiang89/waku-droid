name: Token probe 3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Compare release-creation variants with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          try() {
            label=$1; shift
            if gh api -X POST "repos/$REPO/releases" -F draft=true -f name="probe $label" "$@" > /tmp/out.json 2>/tmp/err.txt; then
              id=$(jq -r .id /tmp/out.json)
              echo "RESULT $label: OK (id $id)"
              gh api -X DELETE "repos/$REPO/releases/$id" >/dev/null && echo "  cleaned $id"
            else
              echo "RESULT $label: FAILED"; cat /tmp/err.txt; cat /tmp/out.json; echo
            fi
          }
          try A_existing_tag_no_target  -f tag_name=v0.1.29
          try B_existing_tag_with_target -f tag_name=v0.1.29 -f target_commitish="$GITHUB_SHA"
          try C_new_tag_with_target      -f tag_name=v0.0.0-probe3c -f target_commitish="$GITHUB_SHA"
          try D_new_tag_no_target        -f tag_name=v0.0.0-probe3d
          try E_new_tag_target_main      -f tag_name=v0.0.0-probe3e -f target_commitish=main
          try F_v0128_existing           -f tag_name=v0.1.28-probe -f target_commitish=1b33ba360a2170c9ee9c568c6d953d821e2f197a
          try G_old_commit_bd03a10       -f tag_name=v0.0.0-probe3g -f target_commitish=bd03a10ed7eeacf29347f4eef59c2cfd18a7f4aa
